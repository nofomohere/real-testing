name: fade-bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: fade-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer-core
        run: npm install --no-audit --no-fund
      - name: Fetch myfxbook sentiment
        run: node mfb_sentiment.js > mfb.json || echo "[]" > mfb.json
      - name: Run fade bot
        env:
          MQL5_COOKIE: ${{ secrets.MQL5_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python detector.py
      - name: Commit state
        run: |
          git config user.name "fade-bot"
          git config user.email "fade-bot@users.noreply.github.com"
          git add state.json ledger.jsonl LEDGER.md 2>/dev/null || true
          git commit -m "bot update $(date -u +%Y%m%d-%H%M%S)" 2>/dev/null || true
          git push 2>/dev/null || true
